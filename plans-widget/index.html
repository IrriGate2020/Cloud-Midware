<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Planos IrriGate</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script type="text/javascript" src="https://admin.tago.io/dist/custom-widget.min.js"></script>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        background: #f4f7fb;
        color: #172033;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: #f4f7fb;
      }

      body {
        overflow-x: hidden;
      }

      #root {
        min-height: 100vh;
      }

      .plans-shell {
        min-height: 100vh;
        padding: clamp(18px, 3vw, 34px);
        background:
          radial-gradient(circle at 12% 10%, rgba(34, 120, 181, 0.12), transparent 26%),
          linear-gradient(135deg, #f8fbff 0%, #eef4f9 48%, #f7faf8 100%);
      }

      .plans-wrap {
        width: min(1180px, 100%);
        margin: 0 auto;
      }

      .plans-header {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 18px;
        align-items: end;
        margin-bottom: 22px;
      }

      .plans-title {
        margin: 0;
        color: #123a5f;
        font-size: clamp(26px, 4vw, 42px);
        line-height: 1.05;
        letter-spacing: 0;
      }

      .plans-subtitle {
        max-width: 720px;
        margin: 10px 0 0;
        color: #526176;
        font-size: 15px;
        line-height: 1.55;
      }

      .plans-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 38px;
        padding: 0 13px;
        border: 1px solid #cfdde9;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.82);
        color: #24435f;
        font-size: 12px;
        font-weight: 800;
        white-space: nowrap;
      }

      .pulse {
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: #2aa66f;
        box-shadow: 0 0 0 5px rgba(42, 166, 111, 0.13);
      }

      .plans-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }

      .plan-card {
        position: relative;
        min-width: 0;
        overflow: hidden;
        border: 1px solid #d8e3ec;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.95);
        box-shadow: 0 16px 40px rgba(31, 51, 73, 0.08);
      }

      .plan-card.featured {
        border-color: #8fc7b0;
        box-shadow: 0 20px 48px rgba(29, 126, 84, 0.15);
      }

      .plan-top {
        padding: 18px 18px 16px;
        border-bottom: 1px solid #e5edf4;
      }

      .plan-kicker {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 13px;
      }

      .plan-icon {
        width: 42px;
        height: 42px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        background: #e8f1f8;
        color: #1f6fae;
      }

      .plan-card.featured .plan-icon {
        background: #e4f5ec;
        color: #1f8f61;
      }

      .plan-label {
        min-height: 28px;
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 0 10px;
        background: #edf3f8;
        color: #38536a;
        font-size: 11px;
        font-weight: 900;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .plan-card.featured .plan-label {
        background: #ddf4e8;
        color: #17633f;
      }

      .plan-name {
        margin: 0;
        color: #123a5f;
        font-size: 24px;
        line-height: 1.1;
        letter-spacing: 0;
      }

      .plan-description {
        margin: 9px 0 0;
        min-height: 66px;
        color: #5a687a;
        font-size: 13px;
        line-height: 1.45;
      }

      .plan-price {
        display: flex;
        align-items: baseline;
        gap: 5px;
        margin-top: 14px;
        color: #123a5f;
      }

      .price-currency {
        font-size: 13px;
        font-weight: 900;
      }

      .price-value {
        font-size: 29px;
        line-height: 1;
        font-weight: 950;
        letter-spacing: 0;
      }

      .price-period {
        color: #6a7788;
        font-size: 12px;
        font-weight: 800;
      }

      .plan-body {
        padding: 16px 18px 18px;
      }

      .metric-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 9px;
        margin-bottom: 16px;
      }

      .metric {
        min-width: 0;
        min-height: 76px;
        border: 1px solid #e1e9f0;
        border-radius: 8px;
        background: #f8fbfd;
        padding: 10px;
      }

      .metric-value {
        display: block;
        color: #172033;
        font-size: 20px;
        line-height: 1;
        font-weight: 900;
        letter-spacing: 0;
      }

      .metric-label {
        display: block;
        margin-top: 7px;
        color: #66778a;
        font-size: 11px;
        line-height: 1.25;
        font-weight: 700;
      }

      .feature-list {
        display: grid;
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .feature-item {
        display: grid;
        grid-template-columns: 22px minmax(0, 1fr);
        gap: 8px;
        align-items: start;
        color: #26374b;
        font-size: 13px;
        line-height: 1.38;
      }

      .feature-mark {
        width: 22px;
        height: 22px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        background: #e8f3ed;
        color: #1f8f61;
        font-weight: 900;
        font-size: 13px;
      }

      .feature-mark.off {
        background: #eef2f5;
        color: #8794a3;
      }

      .comparison {
        margin-top: 16px;
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
        gap: 16px;
      }

      .info-panel {
        border: 1px solid #d8e3ec;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.9);
        padding: 18px;
        box-shadow: 0 12px 32px rgba(31, 51, 73, 0.06);
      }

      .info-panel h2 {
        margin: 0 0 12px;
        color: #123a5f;
        font-size: 17px;
        line-height: 1.2;
        letter-spacing: 0;
      }

      .use-cases {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .use-case {
        min-width: 0;
        border-radius: 8px;
        background: #f7fafc;
        border: 1px solid #e1e9f0;
        padding: 12px;
      }

      .use-case strong {
        display: block;
        color: #20334a;
        font-size: 13px;
        margin-bottom: 5px;
      }

      .use-case span {
        color: #657487;
        font-size: 12px;
        line-height: 1.35;
      }

      .status-list {
        display: grid;
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .status-list li {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        color: #425267;
        font-size: 13px;
        line-height: 1.4;
      }

      .status-dot {
        flex: 0 0 auto;
        width: 8px;
        height: 8px;
        border-radius: 999px;
        margin-top: 5px;
        background: #2870b8;
      }

      .status-dot.green {
        background: #1f8f61;
      }

      .status-dot.gold {
        background: #c8902d;
      }

      svg {
        width: 22px;
        height: 22px;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }

      @media (max-width: 980px) {
        .plans-header,
        .comparison {
          grid-template-columns: 1fr;
        }

        .plans-grid {
          grid-template-columns: 1fr;
        }

        .plan-description {
          min-height: 0;
        }

        .use-cases {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 520px) {
        .plans-shell {
          padding: 14px;
        }

        .metric-grid {
          grid-template-columns: 1fr;
        }

        .plans-badge {
          justify-content: center;
          width: 100%;
          white-space: normal;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const plans = [
        {
          id: "visualizacao",
          name: "Essencial(Visualização)",
          label: "Essencial",
          description: "Para acompanhar os dados essenciais da operação com simplicidade.",
          sensors: "5",
          alerts: "0",
          reports: "0",
          retention: "7",
          price: "49,90",
          icon: "eye",
          features: [
            ["Até 5 sensores cadastrados", true],
            ["Alertas automáticos não inclusos", false],
            ["Relatórios automáticos não inclusos", false],
            ["7 dias de dados", true],
            ["Abertura de chamados diretamente com o time de suporte não inclusa", false],
            ["Atendimento por WhatsApp não incluso", false],
            ["Tempo de resposta dedicado não incluso", false]
          ]
        },
        {
          id: "intermediario",
          name: "Avançado",
          label: "Operação",
          description: "Para equipes que precisam acompanhar eventos críticos, abrir suporte e gerar um relatório, com atendimento crítico em até 6 horas úteis.",
          sensors: "10",
          alerts: "10",
          reports: "1",
          retention: "30",
          price: "99,90",
          icon: "bell",
          features: [
            ["Até 10 sensores cadastrados", true],
            ["10 alertas configuráveis", true],
            ["1 relatório disponível", true],
            ["30 dias de dados", true],
            ["Abertura de chamados diretamente com o time de suporte", true],
            ["Atendimento por WhatsApp não incluso", false],
            ["Atendimentos críticos: até 6 horas úteis", true]
          ]
        },
        {
          id: "diamante",
          name: "Premium",
          label: "Completo",
          description: "Para operações com mais dispositivos, mais automação e canais de suporte mais diretos, com atendimento crítico em até 3 horas úteis ou até 6 horas em dias não úteis.",
          sensors: "30",
          alerts: "30",
          reports: "5",
          retention: "90",
          price: "249,90",
          icon: "diamond",
          featured: true,
          features: [
            ["Até 30 sensores cadastrados", true],
            ["30 alertas configuráveis", true],
            ["5 relatórios disponíveis", true],
            ["90 dias de dados", true],
            ["Abertura de chamados diretamente com o time de suporte", true],
            ["Abertura de chamados integrado com o Whatsapp", true],
            ["Atendimentos críticos: até 3 horas úteis ou até 6 horas em dias não úteis", true]
          ]
        }
      ];

      const icons = {
        eye: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>',
        bell: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>',
        diamond: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12l4 6-10 12L2 9l4-6Z"/><path d="M2 9h20"/><path d="m6 3 6 18 6-18"/></svg>'
      };

      function renderPlan(plan) {
        const features = plan.features.map(([text, enabled]) => `
          <li class="feature-item">
            <span class="feature-mark ${enabled ? "" : "off"}">${enabled ? "✓" : "–"}</span>
            <span>${text}</span>
          </li>
        `).join("");

        return `
          <article class="plan-card ${plan.featured ? "featured" : ""}">
            <div class="plan-top">
              <div class="plan-kicker">
                <div class="plan-icon">${icons[plan.icon]}</div>
                <span class="plan-label">${plan.label}</span>
              </div>
              <h2 class="plan-name">${plan.name}</h2>
              <div class="plan-price" aria-label="Preço do plano ${plan.name}">
                <span class="price-currency">R$</span>
                <span class="price-value">${plan.price}</span>
                <span class="price-period">/ mês</span>
              </div>
              <p class="plan-description">${plan.description}</p>
            </div>
            <div class="plan-body">
              <div class="metric-grid" aria-label="Limites do plano ${plan.name}">
                <div class="metric">
                  <span class="metric-value">${plan.sensors}</span>
                  <span class="metric-label">sensores</span>
                </div>
                <div class="metric">
                  <span class="metric-value">${plan.alerts}</span>
                  <span class="metric-label">alertas</span>
                </div>
                <div class="metric">
                  <span class="metric-value">${plan.reports}</span>
                  <span class="metric-label">relatórios</span>
                </div>
                <div class="metric">
                  <span class="metric-value">${plan.retention}</span>
                  <span class="metric-label">dias de dados</span>
                </div>
              </div>
              <ul class="feature-list">${features}</ul>
            </div>
          </article>
        `;
      }

      function render() {
        const root = document.getElementById("root");
        root.innerHTML = `
          <main class="plans-shell">
            <div class="plans-wrap">
              <header class="plans-header">
                <div>
                  <h1 class="plans-title">Planos IrriGate</h1>
                  <p class="plans-subtitle">
                    Escolha o plano ideal para o tamanho da operação. Cada opção define quantos sensores,
                    alertas, relatórios, histórico de dados e canais de suporte ficam disponíveis para a organização.
                    Entre em contato para planos personalizados.
                  </p>
                </div>
                <div class="plans-badge"><span class="pulse"></span> Visão clara para usuários e gestores</div>
              </header>

              <section class="plans-grid" aria-label="Descrição dos planos">
                ${plans.map(renderPlan).join("")}
              </section>

              <section class="comparison">
                <div class="info-panel">
                  <h2>Indicação de uso</h2>
                  <div class="use-cases">
                    <div class="use-case">
                      <strong>Essencial</strong>
                      <span>Ideal para clientes que precisam apenas consultar dados básicos por sensor.</span>
                    </div>
                    <div class="use-case">
                      <strong>Avançado</strong>
                      <span>Bom para operações que já precisam de alertas, suporte formal e um relatório.</span>
                    </div>
                    <div class="use-case">
                      <strong>Premium</strong>
                      <span>Indicado para operações maiores, com mais automação e contato direto por WhatsApp.</span>
                    </div>
                  </div>
                </div>

                <aside class="info-panel">
                  <h2>Como os limites funcionam</h2>
                  <ul class="status-list">
                    <li><span class="status-dot"></span><span>Alertas e relatórios são descontados quando criados no sistema.</span></li>
                    <li><span class="status-dot green"></span><span>O status da organização mostra usados, restantes e limite contratado.</span></li>
                    <li><span class="status-dot gold"></span><span>O histórico disponível segue o plano: 7 dias de dados no Essencial, 30 dias de dados no Avançado e 90 dias de dados no Premium.</span></li>
                    <li><span class="status-dot"></span><span>O limite de sensores depende do fluxo de cadastro de sensores da organização.</span></li>
                  </ul>
                </aside>
              </section>
            </div>
          </main>
        `;
      }

      render();

      if (window.TagoIO && typeof window.TagoIO.ready === "function") {
        window.TagoIO.ready();
      }
    </script>
  </body>
</html>
